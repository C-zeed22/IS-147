<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Disk Storage — Practice Quiz</title>
<style>

    text-align: center;
  }

  }

    justify-content: space-between;
    align-items: center;
    font-size: 13px;

  .topic-tag {
    display: inline-block;
    background: var(--soft);
    color: var(--accent-dark);

    font-size: 12px;

    font-size: 18px;
    font-weight: 600;
    line-height: 1.45;

  .choice {

    border-radius: 10px;

    color: var(--ink);

    font-family: inherit;

    align-items: flex-start;
    gap: 10px;
    line-height: 1.4;
  }
  .choice:hover:not(.locked) {
    border-color: var(--accent);
    background: var(--soft);
  }
  .choice .letter {
    flex: 0 0 24px;
    height: 24px;
    line-height: 24px;
    text-align: center;
    background: var(--soft);
    border-radius: 6px;
    font-weight: 700;
    font-size: 13px;
    color: var(--accent-dark);
  }
  .choice.correct {
    border-color: var(--good);
    background: var(--good-bg);
  }
  .choice.correct .letter {
    background: var(--good);
    color: #fff;
  }
  .choice.wrong {
    border-color: var(--bad);
    background: var(--bad-bg);
  }
  .choice.wrong .letter {
    background: var(--bad);
    color: #fff;
  }
  .choice.locked { cursor: default; }
  .feedback {
    margin-top: 8px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
    display: none;
  }
  .feedback.good {
    background: var(--good-bg);
    color: #155724;
    border-left: 4px solid var(--good);
    display: block;
  }
  .feedback.bad {
    background: var(--bad-bg);
    color: #6b1f1a;
    border-left: 4px solid var(--bad);
    display: block;
  }
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    gap: 12px;
  }
  button.btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    font-family: inherit;

  button.btn:hover { background: var(--accent-dark); }
  button.btn:disabled {
    background: #b8c2cf;
    cursor: not-allowed;
  }
  button.btn.secondary {
    background: #fff;
    color: var(--accent-dark);
    border: 1.5px solid var(--accent);

  button.btn.secondary:hover { background: var(--soft); }

    font-weight: 700;
    color: var(--accent-dark);
    line-height: 1;
    margin: 8px 0;
  }
  .results h2 { margin: 4px 0 4px; font-size: 22px; }

  .topic-breakdown {

    border-top: 1px solid var(--border);

// --- state ---
let questions = [];
let idx = 0;
let answered = []; // parallel array of user's chosen index, or null
let correctCount = 0;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function init() {
  // Shuffle question order, and shuffle choices within each question (preserving correct index)
  questions = shuffle(QUESTIONS_RAW).map(q => {
    const indices = q.choices.map((_, i) => i);
    const shuffled = shuffle(indices);
    const newChoices = shuffled.map(i => q.choices[i]);
    const newAnswer = shuffled.indexOf(q.answer);
    return { ...q, choices: newChoices, answer: newAnswer };
  });
  idx = 0;
  answered = new Array(questions.length).fill(null);
  correctCount = 0;
  render();
}

function render() {
  const app = document.getElementById('app');
  if (idx >= questions.length) {
    renderResults();
    return;
  }
  const q = questions[idx];
  const userAns = answered[idx];
  const letters = ['A','B','C','D','E','F'];

  app.innerHTML = `
    <div class="progress-bar"><div class="progress-fill" style="width:${(idx / questions.length) * 100}%"></div></div>
    <div class="meta">
      <span class="topic-tag">${q.topic}</span>
      <span>Question ${idx + 1} of ${questions.length} &middot; Score: ${correctCount}</span>
    </div>
    <div class="question">${q.q}</div>
    <div class="choices" id="choices">
      ${q.choices.map((c, i) => `
        <button class="choice" data-i="${i}">
          <span class="letter">${letters[i]}</span>
          <span>${c}</span>
        </button>
      `).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="controls">
      <button class="btn secondary" id="restart">Restart quiz</button>
      <button class="btn" id="next" disabled>${idx === questions.length - 1 ? 'See results' : 'Next →'}</button>
    </div>
  `;

  document.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => onAnswer(parseInt(btn.dataset.i, 10)));
  });
  document.getElementById('next').addEventListener('click', () => { idx++; render(); });
  document.getElementById('restart').addEventListener('click', () => {
    if (confirm('Restart with a fresh shuffle?')) init();
  });

  // If already answered, lock state
  if (userAns !== null) {
    lockChoices(userAns);
  }
}

function onAnswer(choiceIdx) {
  if (answered[idx] !== null) return;
  answered[idx] = choiceIdx;
  const q = questions[idx];
  if (choiceIdx === q.answer) correctCount++;
  lockChoices(choiceIdx);
  document.getElementById('next').disabled = false;
}

function lockChoices(choiceIdx) {
  const q = questions[idx];
  const choices = document.querySelectorAll('.choice');
  choices.forEach((btn, i) => {
    btn.classList.add('locked');
    if (i === q.answer) btn.classList.add('correct');
    if (i === choiceIdx && choiceIdx !== q.answer) btn.classList.add('wrong');
  });
  const fb = document.getElementById('feedback');
  if (choiceIdx === q.answer) {
    fb.className = 'feedback good';
    fb.innerHTML = `<strong>Correct.</strong> ${q.explanation}`;
  } else {
    fb.className = 'feedback bad';
    fb.innerHTML = `<strong>Not quite.</strong> The answer is <em>${q.choices[q.answer]}</em>. ${q.explanation}`;
  }
}

function renderResults() {
  const app = document.getElementById('app');
  const total = questions.length;
  const pct = Math.round((correctCount / total) * 100);

  // Topic breakdown
  const byTopic = {};
  questions.forEach((q, i) => {
    if (!byTopic[q.topic]) byTopic[q.topic] = { right: 0, total: 0 };
    byTopic[q.topic].total += 1;
    if (answered[i] === q.answer) byTopic[q.topic].right += 1;
  });

  // Wrong answers for review
  const wrong = questions
    .map((q, i) => ({ q, user: answered[i] }))
    .filter(({ q, user }) => user !== q.answer);

  let msg;
  if (pct >= 90) msg = "Excellent — you've got this.";
  else if (pct >= 75) msg = "Strong showing. A quick review and you're set.";
  else if (pct >= 60) msg = "Solid foundation. Review the misses below.";
  else msg = "Worth another pass through the deck. Review the answers below.";

  app.innerHTML = `
    <div class="results">
      <h2>Quiz complete</h2>
      <div class="big-score">${correctCount} / ${total}</div>
      <div class="sub">${pct}% — ${msg}</div>
      <div class="topic-breakdown">
        <strong>By topic</strong>
        ${Object.entries(byTopic).map(([t, v]) => `
          <div class="topic-row"><span>${t}</span><span>${v.right} / ${v.total}</span></div>
        `).join('')}
      </div>
      ${wrong.length ? `
        <div class="review-list">
          <strong>Review these (${wrong.length})</strong>
          ${wrong.map(({ q, user }) => `
            <div class="review-item">
              <div class="rq">${q.q}</div>
              <div class="ra">Your answer: ${user === null ? '—' : q.choices[user]}</div>
              <div class="rc">Correct: ${q.choices[q.answer]}</div>
              <div class="re">${q.explanation}</div>
            </div>
          `).join('')}
        </div>
      ` : '<div style="margin-top:18px;color:var(--good);font-weight:600;">Perfect score!</div>'}
      <div class="controls" style="justify-content:center;margin-top:20px;">
        <button class="btn" id="again">Take it again</button>
      </div>
    </div>
  `;
  document.getElementById('again').addEventListener('click', init);
}

init();
</script>
</body>
</html>
